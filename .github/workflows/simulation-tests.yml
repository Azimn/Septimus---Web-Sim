name: Septimus simulation tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulation, equilibrium and frozen-source regressions
        run: npm test
      - name: Bounded smoke benchmark
        run: npm run experiment
      # All existing research data are frozen; do not regenerate archived experiments.
      - name: Run corrected 60-day isolated need oracles
        run: node tests/needs_equilibrium_corrected.js
      - name: Archive corrected need equilibrium without editing any previous generation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: septimus-corrected-need-equilibrium
          path: |
            results/needs_equilibrium_corrected.json
            results/needs_equilibrium_corrected.md
      - name: Commit corrected equilibrium evidence separately
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "Septimus Research CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/needs_equilibrium_corrected.json results/needs_equilibrium_corrected.md
          if ! git diff --cached --quiet; then
            git commit -m "results(septimus): preserve corrected physiological oracle receipts [skip ci]"
            git push origin HEAD:main
          fi
