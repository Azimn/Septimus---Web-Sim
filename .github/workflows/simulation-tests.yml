name: Septimus simulation tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the actual simulation and journal evidence
        run: npm test
      - name: Preserve bounded life benchmark including failures
        run: npm run experiment
      # Frozen v1 outcome is never re-run or auto-committed by CI.\n