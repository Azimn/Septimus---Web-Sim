name: Septimus simulation tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulation, declared-fact tests, equilibrium and frozen-generation integrity
        run: npm test
      - name: Bounded ordinary-life smoke benchmark
        run: npm run experiment
      - name: Independent household trace (new v5, read-only)\n        run: node tests/diagnose_household_v5.js\n      # Original v1, v2, v3, needs audit, corrected equilibrium and winter v4
      # outputs are frozen and never automatically regenerated or rewritten.
